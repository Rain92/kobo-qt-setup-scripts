#
# qmake configuration for Kobo e-readers (arm-kobo-linux-gnueabihf, koxtoolchain).
#
# Used by build_qt.sh:
# ./configure -device arm-kobo-linux-gnueabihf-g++ -device-option CROSS_COMPILE=/path/to/x-tools/arm-kobo-linux-gnueabihf/bin/arm-kobo-linux-gnueabihf-

include(../common/linux_device_pre.conf)

# Kobo userland is armhf; without this linux_arm_device_post.conf appends -mfloat-abi=softfp
DISTRO_OPTS            += hard-float

QMAKE_CFLAGS           += -march=armv7-a -mtune=cortex-a8 -mfpu=neon -mthumb -D__arm__ -D__ARM_NEON__ -fno-omit-frame-pointer -funwind-tables
QMAKE_CXXFLAGS         += $$QMAKE_CFLAGS
QMAKE_CFLAGS_RELEASE    = -O3 -pipe
QMAKE_CXXFLAGS_RELEASE  = $$QMAKE_CFLAGS_RELEASE
QMAKE_LFLAGS           += -Wl,--no-merge-exidx-entries

include(../common/linux_arm_device_post.conf)
load(qt_config)
